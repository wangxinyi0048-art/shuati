</style></head><body><header><div class="brand">▣ 知练 <span class="muted">数字媒体教师招聘备考</span></div><button class="btn primary" id="download">下载离线单文件</button></header><main><div class="intro"><h1>每道题，都多记住一点。</h1><div class="muted" id="inventory"></div></div><div id="storageWarning" class="notice" hidden></div><div class="grid"><nav class="panel" id="nav"></nav><div><div class="filters"><input type="search" id="search" placeholder="搜索题目、答案或考点" aria-label="搜索题库"><select id="category" aria-label="知识模块"><option value="all">全部知识模块</option></select><select id="source" aria-label="题目来源"><option value="all">全部来源</option><option value="original">原创模拟</option><option value="shot1">截图第一批</option><option value="shot2">截图第二批</option></select><select id="type" aria-label="题目类型"><option value="all">全部题型</option><option value="mc">单选题</option><option value="tf">判断题</option><option value="recall">背诵 / 简答 / 实操</option></select></div><section class="panel" id="card" aria-label="答题区域"></section></div><aside><section class="panel"><h3>学习记录</h3><div class="stats"><div><b id="answered">0</b><span class="muted">客观已答</span></div><div><b id="accuracy">—</b><span class="muted">首次正确率</span></div></div><div class="muted" id="selfstats"></div><hr><h3 id="listtitle">当前题目</h3><div class="list" id="numbers"></div><div class="actions"><button class="btn" id="pageprev">前页</button><button class="btn" id="pagenext">后页</button></div><div class="foot">点选即判分。简答题展示参考要点后自评；待核实题不计分。</div></section><section class="panel tools" style="margin-top:15px"><h3>备份与迁移</h3><button class="btn" id="export">导出记录</button><button class="btn" id="import">导入记录</button><input type="file" id="file" accept="application/json,.json" hidden><details><summary>来源与使用说明</summary><div class="foot">原创题为模拟练习，非官方考纲或真题。截图题出处及原答案未提供；已标记疑义。部分选择题保留考点并改作回忆卡。学习数据仅存当前浏览器；跨设备请导出、导入。离线文件不含账号同步。iPhone/iPad建议在Safari中以网页方式打开；“文件”快速预览可能不执行交互脚本。本文件不等于已安装的PWA。</div></details></section></aside></div><div class="foot">Figma参考：<a href="https://help.figma.com/hc/en-us/articles/5579474826519-Explore-component-properties">组件属性</a> · <a href="https://help.figma.com/hc/en-us/articles/15145852043927-Create-and-manage-variables-and-collections">变量</a> · <a href="https://help.figma.com/hc/en-us/articles/31351261703063-FD4B-Auto-layout-fundamentals">自动布局</a>。资料链接需联网，刷题本身无需联网。</div></main>
<script id="inline-bank">window.bankText = `001|UI/UX|用户界面通常用什么缩写？|UI|UI是用户界面，UX是用户体验。|UI;SQL;MP4;RGB
002|UI/UX|UX主要关注什么？|用户使用产品的整体体验|包括理解、操作、效率与感受。|用户使用产品的整体体验;图片数量;安装包大小;文件命名

004|UI/UX|深入了解用户行为动机，通常采用什么方法？|用户访谈|访谈挖原因。|用户访谈;视频转码;纹理压缩;灯光烘焙

008|UI/UX|问卷更适合什么工作？|收集较多受访者的结构化回答|问卷质量取决于题目与样本。|收集较多受访者的结构化回答;替代所有访谈;自动证明因果关系;完成三维建模
009|UI/UX|用户口头表示喜欢，等于实际操作一定顺利。|错|态度与行为分别验证。

011|UI/UX|用户需求与解决方案有什么区别？|需求描述目标或问题；方案描述实现方式；同一需求可有多个方案。|需求问为何，方案答如何。
012|UI/UX|信息架构主要解决什么问题？|内容组织与导航|内容怎么分、怎么找。|内容组织与导航;镜头曝光;音频采样;视频编码
013|UI/UX|卡片分类常辅助研究什么？|内容分类方式|观察用户如何组织内容。|内容分类方式;视频帧率;相机焦距;模型面数
014|UI/UX|用户流程图表达用户完成目标的步骤与分支。|对|流程表达怎么走。

018|UI/UX|高保真原型通常更接近最终产品的视觉或交互表现。|对|接近成品不等于需求已验证。

023|UI/UX|输入邮箱时提示格式错误，属于什么？|输入校验与纠错反馈|说明问题与修正方式。|输入校验与纠错反馈;材质映射;音频混响;视频调色

027|UI/UX|主要操作比次要操作突出，体现什么？|视觉层级|帮助识别重点。|视觉层级;帧间压缩;色温校正;空间定位
028|UI/UX|如何建立视觉层级？|字号、字重、颜色对比、位置、留白、大小和分组。|大小、轻重、远近、疏密。
029|UI/UX|留白一定浪费屏幕空间。|错|留白有助于分组与阅读。

039|UI/UX|没有记录的页面，怎样设计更好？|解释状态并给出下一步|空状态也引导任务。|解释状态并给出下一步;只留纯白;显示无关广告;自动删除账户

042|UI/UX|用户犹豫时主持人应立即告知正确步骤。|错|过度指导会掩盖问题。
043|UI/UX|说明“被测试的是产品”，主要为了什么？|减少被考核压力|鼓励表达真实困难。|减少被考核压力;保证任务全部成功;替代知情说明;增加测试难度
044|UI/UX|A/B测试中两个数字不同，就能确定改版有效。|错|还需考虑分组、样本、波动和指标。
045|UI/UX|点击率提高但完成率下降，应怎样？|结合目标分析整体影响|局部指标不能代替整体目标。|结合目标分析整体影响;只看点击率;删除全部数据;必然立即全量发布

for(const c of [...new Set(bank.map(q=>q.c))]){const o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o);}$('category').onchange=e=>{category=e.target.value;resetView();};$('source').onchange=e=>{source=e.target.value;resetView();};$('type').onchange=e=>{type=e.target.value;resetView();};$('search').oninput=e=>{query=e.target.value.trim();resetView();};
function download(name,text,mime){const url=URL.createObjectURL(new Blob([text],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
$('export').onclick=()=>download('知练-学习记录-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json');$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('文件超过10MB');const v=JSON.parse(await f.text());if(!validState(v))throw Error('记录格式不正确或不属于此题库');state.answers={...state.answers,...v.answers};state.reviews={...state.reviews,...v.reviews};state.notes={...state.notes,...v.notes};state.saved=[...new Set([...state.saved,...v.saved])];persist();resetView();toast('已合并导入记录；同题以导入记录为准。');}catch(err){toast('导入失败：'+err.message);}e.target.value='';};
$('download').onclick=()=>{const doc=document.documentElement.cloneNode(true);doc.querySelector('#external-bank')?.remove();doc.querySelector('#embedded-bank').textContent=JSON.stringify(bank).replace(/</g,'\\u003c');doc.querySelector('#card').textContent='正在加载本地题库…';doc.querySelector('#nav').replaceChildren();doc.querySelector('#numbers').replaceChildren();doc.querySelector('#category').innerHTML='<option value="all">全部知识模块</option>';doc.querySelector('#search').setAttribute('value','');doc.querySelector('#file').removeAttribute('value');doc.querySelectorAll('select').forEach(el=>el.querySelectorAll('option').forEach(o=>o.removeAttribute('selected')));doc.querySelector('#storageWarning').hidden=true;doc.querySelector('#inventory').textContent='离线题库';doc.querySelector('#answered').textContent='0';doc.querySelector('#accuracy').textContent='—';doc.querySelector('#selfstats').textContent='';doc.querySelectorAll('.toast').forEach(n=>n.remove());download('知练-数字媒体离线题库.html','<!doctype html>\n'+doc.outerHTML,'text/html;charset=utf-8');toast('已生成单文件离线版，不包含你的答题记录；记录请另行导出。');};
if(storageError){$('storageWarning').hidden=false;$('storageWarning').textContent='本地记录不可用或格式异常。请使用导出记录备份；本次可继续练习。';}render();
</script></body></html>
