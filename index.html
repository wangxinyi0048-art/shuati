function filtered(){let arr=base();if(mode==='pending')return arr.filter(q=>q.pending);arr=arr.filter(q=>!q.pending);if(mode==='wrong')return arr.filter(q=>session?.includes(q.id));if(mode==='saved')return arr.filter(q=>state.saved.includes(q.id));return arr;}
function resetView(){session=mode==='wrong'?bank.filter(q=>state.answers[q.id]?.correct===false||state.reviews[q.id]==='again').map(q=>q.id):null;current=null;revealed=false;retrying=false;page=0;render();}

function render(){const arr=filtered();let at=arr.findIndex(q=>q.id===current);if(at<0){at=0;current=arr[0]?.id||null;revealed=false;retrying=false;}const q=arr[at];const pending=bank.filter(q=>q.pending).length;$('inventory').textContent=bank.length+'条题目记录 · '+(bank.length-pending)+'条可练习 · '+pending+'条待补或待核实 · 本地离线版';$('nav').innerHTML=[['practice','◫ 顺序练习'],['wrong','↻ 错题重练'],['saved','☆ 我的收藏'],['memo','✧ 速记卡片'],['pending','! 待核实题']].map(([k,n])=>'<button data-mode="'+k+'" class="'+(mode===k?'active':'')+'">'+n+'</button>').join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;resetView();});const answers=Object.values(state.answers);$('answered').textContent=answers.length;$('accuracy').textContent=answers.length?Math.round(answers.filter(a=>a.firstCorrect).length/answers.length*100)+'%':'—';$('selfstats').textContent='主观题已自评 '+Object.keys(state.reviews).length+' · 收藏 '+state.saved.length+' · 待重练 '+bank.filter(q=>state.answers[q.id]?.correct===false||state.reviews[q.id]==='again').length;
